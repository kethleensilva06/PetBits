schema: spec-driven

context: |
  Project: PetBits — sistema de gestão para clínica veterinária e petshop.

  Domain: Tutores, seus animais, agendamento de serviços, histórico clínico
    e vendas do petshop. Dois perfis de usuário: a equipe da clínica, que
    administra a operação, e o tutor, que acompanha os próprios animais e
    marca atendimentos. Um tutor nunca acessa dados de outro tutor.

  Tech stack:
    Python com venv + pip. Não utilizar uv.
    Frontend: Reflex é a tecnologia obrigatória para implementação das
    interfaces frontend do projeto. Não introduzir outra tecnologia de
    frontend sem uma mudança explícita da decisão arquitetural.
    Persistência: Xano (banco e API REST, acessados por HTTP). A aplicação
    não possui banco local nem ORM.

  Constraints:
    O plano gratuito do Xano aceita 10 requisições a cada 20 segundos, e o
    limite é da instância, não do API group. Uma tela que consulta muitas
    tabelas estoura sozinha: considerar o número de requisições ao desenhar
    qualquer funcionalidade.

  Architecture:
    O backend é responsável pelas regras de negócio e pela persistência.
    O frontend não deve ser considerado mecanismo de segurança.

  Security:
    Regras de autorização são aplicadas no backend, sempre.
    O papel do usuário é lido do banco a cada requisição, nunca do que o
    cliente enviou.
    Credenciais ficam em .env, que não é versionado.

  Development:
    O projeto é desenvolvido incrementalmente utilizando OpenSpec.
    Cada change entrega uma fatia vertical — uma funcionalidade utilizável
    de ponta a ponta. Não organizar changes por camada técnica.
    Escopo novo é change nova, não ampliação da change em andamento.

  Language:
    Escrever a documentação do projeto e os artefatos OpenSpec em português
    brasileiro. Manter em inglês os cabeçalhos estruturais do OpenSpec e as
    palavras-chave SHALL/MUST.

rules:
  proposal:
    - Descrever o problema, o objetivo e o escopo da mudança.
    - Explicitar o que fica fora do escopo.

  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para os comportamentos relevantes, incluindo os casos
      de erro e de acesso negado.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

operations:
  apply:
    guidance:
      - Executar as verificações declaradas na change antes de concluir.
      - Relatar o resultado real da verificação, inclusive quando falhar.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.
